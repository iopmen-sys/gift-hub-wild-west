<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gift Hub — Золотой Дикий Запад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #090604;
      --bg-saloon: #150d08;
      --bg-card: rgba(27, 17, 10, 0.92);
      --bg-card-2: rgba(38, 24, 14, 0.95);
      --gold-1: #fff0b3;
      --gold-2: #e5b548;
      --gold-3: #b37b1d;
      --gold-4: #6b420b;
      --copper: #c86d3b;
      --text-main: #fff7e6;
      --text-muted: #bfa37e;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --accent-blue: #3498db;
      --border-gold: rgba(229, 181, 72, 0.36);
      --shadow-gold: 0 0 24px rgba(229, 181, 72, 0.16);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(229, 181, 72, 0.14), transparent 55%),
        radial-gradient(circle at 15% 25%, rgba(200, 109, 59, 0.1), transparent 45%),
        linear-gradient(180deg, #120a05 0%, #090604 55%, #060402 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 92px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: radial-gradient(var(--gold-2) 0.75px, transparent 0.75px);
      background-size: 22px 22px;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 14px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: linear-gradient(135deg, rgba(44, 27, 14, 0.94), rgba(20, 12, 7, 0.96));
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-gold), inset 0 1px 0 rgba(255, 240, 179, 0.18);
      margin-bottom: 12px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--gold-1), var(--gold-3));
      color: #1c1005;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--gold-2);
      box-shadow: 0 0 14px rgba(229, 181, 72, 0.35);
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-meta {
      min-width: 0;
    }

    .brand-tag {
      font-size: 10px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--gold-2);
      font-weight: 700;
    }

    .user-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .balance-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(229, 181, 72, 0.18), rgba(107, 66, 11, 0.25));
      border: 1px solid rgba(229, 181, 72, 0.5);
      padding: 7px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0;
    }

    .balance-chip:active {
      transform: scale(0.96);
    }

    .balance-val {
      font-weight: 800;
      font-size: 14px;
      color: var(--gold-1);
    }

    .plus-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--gold-1), var(--gold-2));
      color: #1a0f04;
      font-weight: 900;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .card {
      background: linear-gradient(165deg, rgba(33, 20, 11, 0.94), rgba(16, 10, 6, 0.96));
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-gold), inset 0 1px 0 rgba(255, 240, 179, 0.1);
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--gold-1), var(--gold-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(229, 181, 72, 0.14);
      border: 1px solid rgba(229, 181, 72, 0.35);
      color: var(--gold-1);
    }

    .pvp-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .round-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(229, 181, 72, 0.14);
      border: 1px solid rgba(229, 181, 72, 0.42);
      font-size: 12px;
      font-weight: 800;
      color: var(--gold-1);
    }

    .bank-box {
      text-align: right;
    }

    .bank-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .bank-amount {
      font-size: 17px;
      font-weight: 900;
      color: var(--gold-1);
    }

    .support-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(229, 181, 72, 0.55);
      background: linear-gradient(145deg, rgba(64, 39, 17, 0.95), rgba(26, 15, 7, 0.98));
      color: var(--gold-1);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), 0 0 12px rgba(229, 181, 72, 0.2);
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }

    .support-btn:active {
      transform: scale(0.93);
    }

    .wheel-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0 10px;
    }

    .pointer-arrow {
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 22px solid var(--gold-1);
      filter: drop-shadow(0 3px 8px rgba(229, 181, 72, 0.65));
      margin-bottom: -8px;
      z-index: 4;
    }

    .wheel-frame {
      position: relative;
      width: 248px;
      height: 248px;
      border-radius: 50%;
      padding: 8px;
      background: conic-gradient(from 0deg, var(--gold-3), var(--gold-1), var(--gold-4), var(--gold-2), var(--gold-3));
      box-shadow:
        0 0 28px rgba(229, 181, 72, 0.25),
        inset 0 0 18px rgba(0, 0, 0, 0.8);
    }

    .wheel-canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      transition: transform 0.04s linear;
    }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2d1c0e, #0d0805 80%);
      border: 2px solid var(--gold-2);
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.85), inset 0 0 10px rgba(229, 181, 72, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      text-align: center;
      padding: 4px;
    }

    .timer-text {
      font-size: 18px;
      font-weight: 900;
      color: var(--gold-1);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .timer-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 700;
    }

    .status-banner {
      margin-top: 10px;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      background: rgba(229, 181, 72, 0.09);
      border: 1px solid rgba(229, 181, 72, 0.25);
      font-size: 12.5px;
      color: var(--text-main);
      text-align: center;
      line-height: 1.35;
    }

    .bet-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .input-gold {
      flex: 1;
      background: rgba(12, 7, 4, 0.9);
      border: 1px solid rgba(229, 181, 72, 0.45);
      border-radius: var(--radius-md);
      padding: 11px 12px;
      color: var(--gold-1);
      font-size: 15px;
      font-weight: 800;
      outline: none;
      min-width: 0;
    }

    .input-gold:focus {
      border-color: var(--gold-1);
      box-shadow: 0 0 12px rgba(229, 181, 72, 0.25);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
      color: #1b0f04;
      border: none;
      border-radius: var(--radius-md);
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(229, 181, 72, 0.32);
      transition: transform 0.14s ease, filter 0.14s ease;
      white-space: nowrap;
    }

    .btn-gold:active {
      transform: scale(0.96);
    }

    .btn-gold:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-dark {
      background: rgba(45, 28, 15, 0.9);
      color: var(--gold-1);
      border: 1px solid rgba(229, 181, 72, 0.35);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .btn-dark:active {
      transform: scale(0.95);
      background: rgba(229, 181, 72, 0.22);
    }

    .quick-bets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .players-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      background: rgba(22, 13, 8, 0.88);
      border: 1px solid rgba(229, 181, 72, 0.22);
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .player-name {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bot-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(229, 181, 72, 0.16);
      color: var(--gold-2);
      font-weight: 800;
      margin-left: 5px;
    }

    .player-right {
      text-align: right;
      flex-shrink: 0;
    }

    .player-bet {
      font-size: 13px;
      font-weight: 800;
      color: var(--gold-1);
    }

    .player-chance {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .tabs-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .tab-pill {
      padding: 8px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(229, 181, 72, 0.26);
      background: rgba(20, 12, 7, 0.8);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .tab-pill.active {
      background: linear-gradient(135deg, rgba(229, 181, 72, 0.25), rgba(107, 66, 11, 0.35));
      color: var(--gold-1);
      border-color: var(--gold-2);
    }

    .history-item {
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      background: rgba(16, 10, 6, 0.85);
      border: 1px solid rgba(229, 181, 72, 0.18);
      margin-bottom: 7px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .history-sub {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .solo-choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .solo-choice-card {
      position: relative;
      overflow: hidden;
      padding: 14px 12px;
      border-radius: var(--radius-lg);
      border: 1.5px solid rgba(229, 181, 72, 0.32);
      background: radial-gradient(circle at 80% 15%, rgba(255, 240, 179, 0.16), transparent 55%),
                  linear-gradient(160deg, rgba(42, 25, 13, 0.95), rgba(16, 10, 6, 0.98));
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .solo-choice-card.active {
      border-color: var(--gold-1);
      box-shadow: 0 0 22px rgba(229, 181, 72, 0.28);
      transform: translateY(-1px);
    }

    .solo-stars-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 20% 25%, rgba(255, 240, 179, 0.65), transparent),
        radial-gradient(1.2px 1.2px at 78% 22%, rgba(229, 181, 72, 0.7), transparent),
        radial-gradient(1.5px 1.5px at 65% 72%, rgba(255, 240, 179, 0.55), transparent),
        radial-gradient(1px 1px at 30% 80%, rgba(229, 181, 72, 0.6), transparent);
    }

    .solo-icon-badge {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: linear-gradient(145deg, rgba(229, 181, 72, 0.25), rgba(107, 66, 11, 0.35));
      border: 1px solid rgba(229, 181, 72, 0.45);
      margin-bottom: 8px;
    }

    .solo-card-title {
      position: relative;
      font-size: 15px;
      font-weight: 900;
      color: var(--gold-1);
    }

    .solo-card-stat {
      position: relative;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 700;
    }

    .upgrade-wheel-wrap {
      position: relative;
      width: 196px;
      height: 196px;
      margin: 10px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upgrade-pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 18px solid var(--gold-1);
      z-index: 5;
      filter: drop-shadow(0 2px 6px rgba(229, 181, 72, 0.6));
    }

    .upgrade-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(229, 181, 72, 0.35);
      transition: transform 0.05s linear;
    }

    .upgrade-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .upgrade-center {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, #2a190c, #0c0704);
      border: 2px solid var(--gold-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 3;
    }

    .balls-canvas-wrap {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid rgba(229, 181, 72, 0.38);
      background: radial-gradient(circle at 50% 15%, rgba(229, 181, 72, 0.12), rgba(12, 8, 5, 0.98) 75%);
      margin: 8px 0 10px;
    }

    #ballsCanvas {
      display: block;
      width: 100%;
      height: 290px;
    }

    .deck-info {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .deck-chip {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(229, 181, 72, 0.12);
      border: 1px solid rgba(229, 181, 72, 0.28);
      color: var(--gold-1);
    }

    .live-feed {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 210px;
      overflow-y: auto;
    }

    .feed-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: rgba(20, 12, 7, 0.9);
      border: 1px solid rgba(229, 181, 72, 0.2);
      font-size: 12px;
      animation: fadeSlideIn 0.28s ease;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .gift-card {
      background: linear-gradient(160deg, rgba(40, 24, 12, 0.95), rgba(18, 11, 6, 0.98));
      border: 1px solid rgba(229, 181, 72, 0.32);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .gift-emoji {
      font-size: 28px;
      line-height: 1.1;
    }

    .gift-name {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-main);
    }

    .gift-base {
      font-size: 11px;
      color: var(--text-muted);
    }

    .gift-price {
      font-size: 14px;
      font-weight: 900;
      color: var(--gold-1);
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin-top: 10px;
    }

    .stat-box {
      padding: 11px;
      border-radius: var(--radius-md);
      background: rgba(18, 11, 6, 0.9);
      border: 1px solid rgba(229, 181, 72, 0.24);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .stat-num {
      font-size: 17px;
      font-weight: 900;
      color: var(--gold-1);
      margin-top: 3px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: linear-gradient(180deg, rgba(24, 14, 8, 0.96), rgba(10, 6, 3, 0.99));
      border-top: 1px solid rgba(229, 181, 72, 0.4);
      backdrop-filter: blur(12px);
      padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
    }

    .bottom-nav-inner {
      max-width: 480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      border-radius: 12px;
      padding: 6px 4px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .nav-btn.active {
      color: var(--gold-1);
      ba
